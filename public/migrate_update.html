<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualización NLACE → Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 24px; color: #141414; }
    .card { background: white; border-radius: 12px; padding: 24px; max-width: 620px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; margin-bottom: 4px; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 16px; font-family: monospace; }
    button { width: 100%; padding: 12px; background: #5869f7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #log { margin-top: 20px; background: #111; color: #eee; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; display: none; white-space: pre-wrap; overflow-y: auto; max-height: 420px; }
    .ok   { color: #22c55e; }
    .err  { color: #f87171; }
    .info { color: #93c5fd; }
    .warn { color: #fbbf24; }
  </style>
</head>
<body>
<div class="card">
  <h1>Actualización NLACE → Supabase</h1>
  <p class="sub">Limpia ventas, costos y gastos, y los reimporta desde Google Sheets con los nuevos campos <code>rut_cliente</code> y <code>descripcion_glosa</code>.</p>

  <label>Service Role Key (JWT)</label>
  <input type="password" id="secretKey" placeholder="eyJhbGci..." autocomplete="off" />

  <button id="btnRun" onclick="runUpdate()">Iniciar actualización</button>
  <pre id="log"></pre>
</div>

<script>
const SUPABASE_URL = 'https://orjufhwfepojfiqejhfc.supabase.co'
const NLACE_RUT    = '77743235-4'
const CSV_URL      = 'https://docs.google.com/spreadsheets/d/1bkKIE2dD_HCBevKrunZa--mQH9rfUCZV26OKug7QJPM/export?format=csv&gid=1320604970'
const BATCH_SIZE   = 200

const logEl = document.getElementById('log')
const btn   = document.getElementById('btnRun')

function log(msg, cls) {
  logEl.style.display = 'block'
  const span = document.createElement('span')
  if (cls) span.className = cls
  span.textContent = msg + '\n'
  logEl.appendChild(span)
  logEl.scrollTop = logEl.scrollHeight
}

function parseFecha(str) {
  if (!str || !str.trim()) return null
  const s = str.trim()
  const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)
  if (m1) return `${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`
  const m2 = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/)
  if (m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10)
  return null
}

function parseMonto(str) {
  if (!str) return null
  const cleaned = String(str).replace(/\./g,'').replace(/,/g,'.').replace(/[^0-9.\-]/g,'')
  const n = parseFloat(cleaned)
  return isNaN(n) ? null : n
}

function parseCSV(text) {
  const lines = text.split('\n')
  if (!lines.length) return []
  const headers = []
  let cur = '', inQ = false
  for (let c = 0; c < lines[0].length; c++) {
    const ch = lines[0][c]
    if (ch === '"') { inQ = !inQ }
    else if (ch === ',' && !inQ) { headers.push(cur.trim()); cur = '' }
    else cur += ch
  }
  headers.push(cur.trim())

  const rows = []
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim()
    if (!line) continue
    const vals = []; cur = ''; inQ = false
    for (let c = 0; c < line.length; c++) {
      const ch = line[c]
      if (ch === '"') { inQ = !inQ }
      else if (ch === ',' && !inQ) { vals.push(cur); cur = '' }
      else cur += ch
    }
    vals.push(cur)
    const row = {}
    headers.forEach((h, idx) => { row[h] = (vals[idx] || '').replace(/^"|"$/g,'').trim() })
    rows.push(row)
  }
  return rows
}

function toVenta(row, empresaId) {
  return {
    empresa_id:          empresaId,
    cuenta_cble:         row['Cuenta_Cble']          || null,
    descripcion_cta:     row['Descripcion Cta.'] || row['Descripcion Cta'] || null,
    clasificacion_gasto: row['Clasificacion_Gasto']  || null,
    clasificacion_cto:   row['Clasificacion_Cto']    || null,
    tipo_cuenta:         row['Tipo_Cuenta']           || null,
    estado:              row['Estado']                || null,
    mes_economico:       row['Mes_economico']         || null,
    ano_eco:             row['Ano_eco']               || null,
    monto_bruto:         parseMonto(row['monto_bruto']),
    fecha_emision:       parseFecha(row['Fecha_emision']),
    fecha_pago:          parseFecha(row['Fecha_Pago']),
    fecha_vencimiento:   parseFecha(row['Fecha_Vencimiento']),
    cliente:             row['Cliente']               || null,
    rut_cliente:         row['RUT_Cliente']           || null,
  }
}

function toCosto(row, empresaId) {
  return {
    empresa_id:          empresaId,
    cuenta_cble:         row['Cuenta_Cble']          || null,
    descripcion_cta:     row['Descripcion Cta.'] || row['Descripcion Cta'] || null,
    clasificacion_gasto: row['Clasificacion_Gasto']  || null,
    clasificacion_cto:   row['Clasificacion_Cto']    || null,
    tipo_cuenta:         row['Tipo_Cuenta']           || null,
    estado:              row['Estado']                || null,
    mes_economico:       row['Mes_economico']         || null,
    ano_eco:             row['Ano_eco']               || null,
    monto_bruto:         parseMonto(row['monto_bruto']),
    fecha_emision:       parseFecha(row['Fecha_emision']),
    fecha_pago:          parseFecha(row['Fecha_Pago']),
    fecha_vencimiento:   parseFecha(row['Fecha_Vencimiento']),
    cliente:             row['Cliente']               || null,
    descripcion_glosa:   row['Descripcion_glosa']    || null,
  }
}

function toGasto(row, empresaId) {
  return {
    empresa_id:          empresaId,
    cuenta_cble:         row['Cuenta_Cble']          || null,
    descripcion_cta:     row['Descripcion Cta.'] || row['Descripcion Cta'] || null,
    clasificacion_gasto: row['Clasificacion_Gasto']  || null,
    clasificacion_cto:   row['Clasificacion_Cto']    || null,
    tipo_cuenta:         row['Tipo_Cuenta']           || null,
    estado:              row['Estado']                || null,
    mes_economico:       row['Mes_economico']         || null,
    ano_eco:             row['Ano_eco']               || null,
    monto_bruto:         parseMonto(row['monto_bruto']),
    fecha_emision:       parseFecha(row['Fecha_emision']),
    fecha_pago:          parseFecha(row['Fecha_Pago']),
    fecha_vencimiento:   parseFecha(row['Fecha_Vencimiento']),
    cliente:             row['Cliente']               || null,
    descripcion_glosa:   row['Descripcion_glosa']    || null,
  }
}

async function insertBatches(supabase, table, records) {
  let inserted = 0
  for (let i = 0; i < records.length; i += BATCH_SIZE) {
    const batch = records.slice(i, i + BATCH_SIZE)
    const { error } = await supabase.from(table).insert(batch)
    if (error) throw new Error(`${table}: ${error.message}`)
    inserted += batch.length
    const last = logEl.lastChild
    if (last) last.textContent = `  ${table}: ${inserted}/${records.length} filas...\n`
  }
  log(`  ✓ ${table}: ${inserted} filas`, 'ok')
  return inserted
}

async function runUpdate() {
  const secret = document.getElementById('secretKey').value.trim()
  if (!secret) { alert('Ingresa la Service Role Key'); return }

  btn.disabled = true
  logEl.innerHTML = ''

  try {
    const supabase = window.supabase.createClient(SUPABASE_URL, secret)

    // 1. Obtener empresa_id
    log('1. Obteniendo empresa NLACE...')
    const { data: emp } = await supabase.from('empresas').select('id').eq('rut', NLACE_RUT)
    if (!emp || emp.length === 0) throw new Error('Empresa no encontrada: ' + NLACE_RUT)
    const empresaId = emp[0].id
    log(`   empresa_id: ${empresaId}`, 'ok')

    // 2. Limpiar tablas
    log('\n2. Limpiando ventas, costos y gastos...')
    for (const tabla of ['ventas', 'costos', 'gastos']) {
      const { error } = await supabase.from(tabla).delete().eq('empresa_id', empresaId)
      if (error) throw new Error(`Error limpiando ${tabla}: ${error.message}`)
      log(`   ✓ ${tabla} limpiada`, 'ok')
    }

    // 3. Descargar CSV
    log('\n3. Descargando Google Sheet...')
    const res = await fetch(CSV_URL)
    if (!res.ok) throw new Error('Error descargando CSV: ' + res.status)
    const csvText = await res.text()
    log(`   CSV: ${(csvText.length/1024).toFixed(0)} KB descargados`, 'ok')

    // 4. Parsear y clasificar
    log('\n4. Procesando filas...')
    const allRows  = parseCSV(csvText)
    const tipos    = ['Ingreso','Costo','Gasto','Remun']
    const filtered = allRows.filter(r => tipos.includes((r['Tipo']||'').trim()))

    const ventas         = filtered.filter(r => r['Tipo'].trim()==='Ingreso').map(r => toVenta(r, empresaId))
    const costos         = filtered.filter(r => r['Tipo'].trim()==='Costo').map(r => toCosto(r, empresaId))
    const gastos         = filtered.filter(r => r['Tipo'].trim()==='Gasto').map(r => toGasto(r, empresaId))

    log(`   Ventas:  ${ventas.length} filas`)
    log(`   Costos:  ${costos.length} filas`)
    log(`   Gastos:  ${gastos.length} filas`)
    log(`   (Remuneraciones no se tocan)`, 'warn')

    // 5. Insertar
    log('\n5. Insertando...')
    let total = 0
    log(`  ventas: 0/${ventas.length} filas...`, 'info')
    total += await insertBatches(supabase, 'ventas', ventas)
    log(`  costos: 0/${costos.length} filas...`, 'info')
    total += await insertBatches(supabase, 'costos', costos)
    log(`  gastos: 0/${gastos.length} filas...`, 'info')
    total += await insertBatches(supabase, 'gastos', gastos)

    log(`\n✅ Actualización completa: ${total} filas reimportadas`, 'ok')

  } catch(e) {
    log('\n❌ Error: ' + e.message, 'err')
  } finally {
    btn.disabled = false
  }
}
</script>
</body>
</html>
