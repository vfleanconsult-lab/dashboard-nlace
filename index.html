<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NLACE — Resumen Ejecutivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

  <div id="sidebar-mount"></div>

  <main class="main">
    <div id="header-mount"></div>

    <div class="content" id="page-content">
      <div class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Cargando datos financieros…</div>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script>
  (function () {
    'use strict';

    const D = NLaceData;
    const C = NLaceCharts;
    const U = NLaceUI;

    let allRows = [];
    let activeYear = null;

    // ── Bootstrap ──────────────────────────────────────────────────────────
    document.getElementById('sidebar-mount').innerHTML = U.renderSidebar();
    document.getElementById('header-mount').innerHTML  = U.renderPageHeader(
      'Resumen Ejecutivo',
      'Vista consolidada · YTD'
    );

    C.applyGlobalDefaults();

    NLaceUI.onYearChange = function (y) {
      activeYear = y === 'all' ? null : y;
      U.setActiveYear(y === 'all' ? 'Todos' : y);
      render();
    };

    D.loadData(
      function (rows, years) {
        allRows = rows;
        U.setDataStatus('ready', `${rows.length.toLocaleString()} registros`);
        U.populateYearSelector(years);
        U.setLastUpdated(D.getState().loadedAt);
        activeYear = years[0] || null;
        U.setActiveYear(activeYear || 'Todos');
        if (activeYear) document.getElementById('year-select').value = activeYear;
        render();
      },
      function (err) {
        U.setDataStatus('error', 'Error de carga');
        document.getElementById('page-content').innerHTML = `
          <div class="error-card">
            <h3>No se pudieron cargar los datos</h3>
            <p>Verifica que el Google Sheet sea público y el link de exportación esté activo.</p>
          </div>`;
      }
    );

    // ── Render principal ───────────────────────────────────────────────────
    function render() {
      const rows = D.filterByYear(allRows, activeYear);
      const kpis = D.calcKPIs(rows);
      const months = D.getMonthsForYear(allRows, activeYear || (D.getState().years[0]));

      // Datos mensuales
      const ventasByMonth   = D.groupByMonth(rows, D.isVenta);
      const costosByMonth   = D.groupByMonth(rows, D.isCosto);
      const gastosByMonth   = D.groupByMonth(rows, D.isGasto);

      const labels = months.map(D.monthLabel);

      const ventasArr   = months.map(m => ventasByMonth[m] || 0);
      const margenArr   = months.map(m => {
        const v = ventasByMonth[m] || 0;
        const c = costosByMonth[m] || 0;
        const g = gastosByMonth[m] || 0;
        return v > 0 ? ((v - c - g) / v * 100) : 0;
      });

      // ── Punto de equilibrio (placeholder estructurado) ───────────────────
      // PE = Costos Fijos / (1 - Costos Variables / Ventas)
      // Requiere clasificación fijo/variable. Se muestra estructura lista.
      const peData = months.map(m => ({
        mes: D.monthLabel(m),
        ventas: ventasByMonth[m] || 0,
        pe: null, // Placeholder: requiere parametrización de costos fijos
        gap: null
      }));

      // ── Markup ──────────────────────────────────────────────────────────
      const margenColor = kpis.margenOp >= 0.1 ? 'green' : kpis.margenOp >= 0 ? 'amber' : 'red';
      const margenDotColor = kpis.margenOp >= 0.1 ? 'var(--accent-green)' : kpis.margenOp >= 0 ? 'var(--accent-amber)' : 'var(--accent-red)';

      document.getElementById('page-content').innerHTML = `
        <!-- KPIs -->
        <div class="section-label">Indicadores Clave de Desempeño · ${activeYear || 'Todos los años'}</div>
        <div class="kpi-grid" id="kpi-grid"></div>

        <!-- Gráfico principal -->
        <div class="section-label mt-16">Evolución Mensual</div>
        <div class="chart-card" style="margin-bottom:16px">
          <div class="chart-header">
            <div>
              <div class="chart-title">Ventas Mensuales &amp; Margen Operacional</div>
              <div class="chart-subtitle">Barras = Ventas · Línea = Margen Op. %</div>
            </div>
            <div class="chart-legend">
              <div class="legend-item">
                <div class="legend-dot" style="background:var(--accent-green)"></div>Ventas
              </div>
              <div class="legend-item">
                <div class="legend-dot" style="background:var(--accent-amber)"></div>Margen Op.
              </div>
            </div>
          </div>
          <div class="chart-container tall">
            <canvas id="chart-barline"></canvas>
          </div>
        </div>

        <!-- Tabla Ventas vs PE -->
        <div class="section-label mt-16">Ventas vs Punto de Equilibrio</div>
        <div class="table-card">
          <div class="table-header">
            <span class="table-title">Análisis mensual de cobertura</span>
            <span class="table-badge">Parametrizable</span>
          </div>
          <table class="data-table" id="pe-table">
            <thead>
              <tr>
                <th>Mes</th>
                <th>Ventas</th>
                <th>Punto de Equilibrio</th>
                <th>Gap (Ventas - PE)</th>
                <th>Cobertura</th>
              </tr>
            </thead>
            <tbody id="pe-tbody"></tbody>
          </table>
        </div>
      `;

      // Renderizar KPIs
      const kpiGrid = document.getElementById('kpi-grid');
      kpiGrid.innerHTML = [
        U.kpiCard({
          label: 'Ventas YTD',
          value: D.formatCLP(kpis.ventas, true),
          sub: D.formatCLP(kpis.ventas),
          color: 'green',
          dotColor: 'var(--accent-green)',
          icon: '↑'
        }),
        U.kpiCard({
          label: 'Margen Operacional',
          value: D.formatPct(kpis.margenOp),
          sub: `Utilidad Op.: ${D.formatCLP(kpis.utilOp, true)}`,
          color: margenColor,
          dotColor: margenDotColor,
          icon: '%'
        }),
        U.kpiCard({
          label: 'Otros Ingresos YTD',
          value: D.formatCLP(kpis.otrosIngresos, true),
          sub: D.formatCLP(kpis.otrosIngresos),
          color: 'blue',
          dotColor: 'var(--accent-blue)',
          icon: '+'
        }),
        U.kpiCard({
          label: 'Costos YTD',
          value: D.formatCLP(kpis.costos, true),
          sub: `M. Bruto: ${D.formatPct(kpis.margenBruto)}`,
          color: 'amber',
          dotColor: 'var(--accent-amber)',
          icon: '▼'
        }),
        U.kpiCard({
          label: 'Gastos Operacionales YTD',
          value: D.formatCLP(kpis.gastos, true),
          sub: `${D.formatPct(kpis.ventas > 0 ? kpis.gastos / kpis.ventas : 0)} sobre ventas`,
          color: 'red',
          dotColor: 'var(--accent-red)',
          icon: '◆'
        }),
      ].join('');

      // Gráfico
      C.renderBarLine('chart-barline', labels, ventasArr, margenArr, {
        barLabel: 'Ventas',
        lineLabel: 'Margen Op. %'
      });

      // Tabla PE
      const tbody = document.getElementById('pe-tbody');
      peData.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="primary">${row.mes}</td>
          <td class="mono">${D.formatCLP(row.ventas)}</td>
          <td class="mono text-muted">— (parametrizar)</td>
          <td class="mono text-muted">—</td>
          <td><span class="badge blue">Sin PE definido</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

  })();
  </script>
</body>
</html>
