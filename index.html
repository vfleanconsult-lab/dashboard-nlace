<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard NLace</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; padding:20px; }
.kpi { font-size:22px; margin:10px 0; }
</style>

</head>
<body>

<h2>Dashboard NLace</h2>

<label>Año:</label>
<select id="yearFilter"></select>

<div class="kpi" id="ventas"></div>
<div class="kpi" id="margen"></div>

<canvas id="chart"></canvas>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/1bkKIE2dD_HCBevKrunZa--mQH9rfUCZV26OKug7QJPM/export?format=csv&gid=1320604970";

async function loadData() {
  const res = await fetch(CSV_URL);
  const text = await res.text();

  const rows = text.split("\n").map(r => r.split(","));

  const headers = rows[0];

  const data = rows.slice(1).map(r => {
    let obj = {};
    headers.forEach((h,i)=> obj[h.trim()] = r[i]);
    return obj;
  });

  return data;
}

function getYears(data){
  return [...new Set(data.map(d => d.Ano_eco))];
}

function isVenta(d){
  return d.Cuenta_Cble === "5101-01";
}

function getMonth(d){
  if(!d.Mes_economico) return null;

  // extrae mes directo del formato YYYY-MM
  return Number(d.Mes_economico.substring(5,7));
}

function calculate(data, year){

  const filtered = data.filter(d => d.Ano_eco == year);

  let ventas = 0;
  let costo = 0;
  let gasto = 0;

  filtered.forEach(d => {

    const monto = Number(d.monto_bruto || 0);

    if(d.Tipo === "Ingreso" && isVenta(d)) ventas += monto;
    if(d.Tipo === "Costo") costo += monto;
    if(d.Tipo === "Gasto") gasto += monto;

  });

  return {
    ventas,
    margen: ventas - costo - gasto
  };
}

function buildChart(data, year){

  const filtered = data.filter(d => d.Ano_eco == year);

  const monthMap = {};

  for(let i=1;i<=12;i++){
    monthMap[i] = { ventas:0, costo:0, gasto:0 };
  }

  filtered.forEach(d => {

    const m = getMonth(d);
    if(!m) return;

    const monto = Number(d.monto_bruto || 0);

    if(d.Tipo==="Ingreso" && isVenta(d)) monthMap[m].ventas += monto;
    if(d.Tipo==="Costo") monthMap[m].costo += monto;
    if(d.Tipo==="Gasto") monthMap[m].gasto += monto;

  });

  const labels = [];
  const ventas = [];
  const margen = [];

  Object.keys(monthMap).forEach(m => {

    labels.push(m);

    const v = monthMap[m].ventas;
    const c = monthMap[m].costo;
    const g = monthMap[m].gasto;

    ventas.push(v);
    margen.push(v - c - g);

  });

  new Chart(document.getElementById("chart"), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: 'Ventas', data: ventas },
        { label: 'Margen', data: margen, type: 'line' }
      ]
    }
  });
}

loadData().then(data => {

  const years = getYears(data);

  const select = document.getElementById("yearFilter");

  years.forEach(y=>{
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    select.appendChild(opt);
  });

  function update(){

    const year = select.value;

    const res = calculate(data, year);

    document.getElementById("ventas").innerText =
      "Ventas: " + res.ventas.toLocaleString();

    document.getElementById("margen").innerText =
      "Margen: " + res.margen.toLocaleString();

    buildChart(data, year);
  }

  select.onchange = update;

  update();

});

</script>

</body>
</html>
